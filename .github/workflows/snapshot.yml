name: Refresh shared library download
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armory-download-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check storage policy and bundled downloads
        run: |
          node --test scripts/storage-policy.test.mjs
          python3 -m unittest discover -s scripts -p 'bundle_test.py'
      - name: Publish verified cumulative data and refresh download
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ARMORY_PUBLISHER_TOKEN: ${{ secrets.ARMORY_PUBLISHER_TOKEN }}
          ARMORY_REPOSITORY: ${{ github.repository }}
          ARMORY_SERVICE: https://sao-armory-guild.hamdaouiyassin4.workers.dev
